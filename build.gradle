plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'com.iamlordst.realitybending'
version = '1.1.0'
base { archivesName = 'realitybending' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { realitybending { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.7.1')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure {
    manifest { attributes([
        'Specification-Title': 'realitybending',
        'Specification-Vendor': 'iamlordst-jpg',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version
    ]) }
    finalizedBy 'reobfJar'
}
